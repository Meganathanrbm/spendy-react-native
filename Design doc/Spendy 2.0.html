<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Spendy 2.0 — Design</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #050505; color: #EDEDED; font-family: var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body { min-height: 100vh; }
    button { font-family: inherit; }

    /* Page tabs */
    .pageNav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 1000;
      display: flex; gap: 4px; padding: 4px;
      background: rgba(16, 16, 16, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 0.5px solid #1F1F1F;
      border-radius: 999px;
    }
    .pageNav button {
      padding: 7px 14px; border-radius: 999px;
      background: transparent; border: none; cursor: pointer;
      white-space: nowrap;
      font-size: 12px; font-weight: 600; color: #A1A1A1;
      transition: all 180ms ease;
      letter-spacing: 0.1px;
    }
    .pageNav button.active { background: #1F1F1F; color: #EDEDED; }
    .pageNav button:hover:not(.active) { color: #EDEDED; }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .protoStage {
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #0d0d0d 0%, #050505 60%);
      display: flex; align-items: center; justify-content: center;
      padding: 80px 20px 40px;
      position: relative;
    }
    .protoStage::before {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.025) 1px, transparent 0);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .protoStage .label {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      font-size: 11px; font-weight: 600; color: #5A5A5A; letter-spacing: 1.2px; text-transform: uppercase;
    }

    .dsStage { min-height: 100vh; background: #0A0A0A; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1F1F1F; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2A2A2A; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="theme.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="add-transaction.jsx"></script>
  <script type="text/babel" src="records.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="extras.jsx"></script>
  <script type="text/babel" src="prototype.jsx"></script>
  <script type="text/babel" src="design-system.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" data-presets="react">
    const { useState: useS, useEffect: useE } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "emerald",
      "page": "prototype"
    }/*EDITMODE-END*/;

    // Map from accent hex back to key
    const ACCENT_HEX = { "#34D399": "emerald", "#FBBF24": "amber", "#A78BFA": "iris" };
    const ACCENT_KEY_TO_HEX = { emerald: "#34D399", amber: "#FBBF24", iris: "#A78BFA" };

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const theme = buildTheme(tweaks.accent);
      const [page, setPage] = useS(tweaks.page);

      useE(() => { setPage(tweaks.page); }, [tweaks.page]);

      const accentHex = ACCENT_KEY_TO_HEX[tweaks.accent] || "#34D399";

      return (
        <>
          <div className="pageNav">
            <button className={page === "prototype" ? "active" : ""} onClick={() => { setPage("prototype"); setTweak("page", "prototype"); }}>Prototype</button>
            <button className={page === "design" ? "active" : ""} onClick={() => { setPage("design"); setTweak("page", "design"); }}>Design system</button>
          </div>

          {page === "prototype" && (
            <div className="protoStage">
              <span className="label">Spendy 2.0 · Android Preview</span>
              <Prototype theme={theme}/>
            </div>
          )}
          {page === "design" && (
            <div className="dsStage">
              <DesignSystem theme={theme}/>
            </div>
          )}

          <TweaksPanel>
            <TweakSection label="Accent color">
              <TweakColor
                label="Tone"
                value={accentHex}
                onChange={v => setTweak("accent", ACCENT_HEX[v] || "emerald")}
                options={["#34D399", "#FBBF24", "#A78BFA"]}
              />
            </TweakSection>
            <TweakSection label="View">
              <TweakRadio
                label="Page"
                value={tweaks.page}
                onChange={v => setTweak("page", v)}
                options={["prototype", "design"]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
